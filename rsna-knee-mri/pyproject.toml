[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-mri-portfolio"
version = "0.1.0"
description = "Fold-aware evaluation and reproducible MRI inference engineering case study"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
vision = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
