name: Portfolio tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic demo
        run: python -m knee_portfolio.demo

      - name: Check public release
        run: python scripts/check_public_release.py

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: python -m pip install -e .

      - name: Run vision tests
        run: python -m unittest discover -s tests_vision -v
